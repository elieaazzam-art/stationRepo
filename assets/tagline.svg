<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 56" width="900" height="56" role="img"><title>Pandemonium tagline</title><desc>A typewriter cycles through: a classic RTS, built in Rust; 15 patches · 111 commits · one history; replay it all with git am; build. destroy. repeat..</desc><style>.t{font:16px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}.cover{fill:#0b130f}.cur{fill:#3ddc84;animation:blink 1.05s steps(1) infinite}@keyframes blink{0%{opacity:1}50%{opacity:0}}@keyframes ln0{0%{opacity:1}22%{opacity:1}24%{opacity:0}100%{opacity:0}}@keyframes cv0{0%{transform:translateX(0);animation-timing-function:steps(30,end)}10%{transform:translateX(288px)}100%{transform:translateX(288px)}}.ln0{animation:ln0 18s linear infinite}.cv0{animation:cv0 18s linear infinite}@keyframes ln1{0%{opacity:0}24.998%{opacity:0}25%{opacity:1}47%{opacity:1}49%{opacity:0}100%{opacity:0}}@keyframes cv1{0%{transform:translateX(0)}25%{transform:translateX(0);animation-timing-function:steps(40,end)}35%{transform:translateX(384px)}100%{transform:translateX(384px)}}.ln1{animation:ln1 18s linear infinite}.cv1{animation:cv1 18s linear infinite}@keyframes ln2{0%{opacity:0}49.998%{opacity:0}50%{opacity:1}72%{opacity:1}74%{opacity:0}100%{opacity:0}}@keyframes cv2{0%{transform:translateX(0)}50%{transform:translateX(0);animation-timing-function:steps(27,end)}60%{transform:translateX(259.2px)}100%{transform:translateX(259.2px)}}.ln2{animation:ln2 18s linear infinite}.cv2{animation:cv2 18s linear infinite}@keyframes ln3{0%{opacity:0}74.998%{opacity:0}75%{opacity:1}97%{opacity:1}99%{opacity:0}100%{opacity:0}}@keyframes cv3{0%{transform:translateX(0)}75%{transform:translateX(0);animation-timing-function:steps(25,end)}85%{transform:translateX(240px)}100%{transform:translateX(240px)}}.ln3{animation:ln3 18s linear infinite}.cv3{animation:cv3 18s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}.ln{opacity:0}.ln0{opacity:1}.cv{display:none}}</style><rect x=".5" y=".5" width="899" height="55" rx="14" fill="#0b130f" stroke="#233a2d"/><g class="ln ln0"><text class="t" x="306" y="34" textLength="288" fill="#dcf1e4"><tspan fill="#3ddc84">▸</tspan> a classic RTS, built in Rust</text><g class="cv cv0"><rect class="cover" x="306" y="14" width="584" height="28"/><rect class="cur" x="306" y="17" width="8" height="22"/></g></g><g class="ln ln1"><text class="t" x="258" y="34" textLength="384" fill="#dcf1e4"><tspan fill="#3ddc84">▸</tspan> 15 patches · 111 commits · one history</text><g class="cv cv1"><rect class="cover" x="258" y="14" width="632" height="28"/><rect class="cur" x="258" y="17" width="8" height="22"/></g></g><g class="ln ln2"><text class="t" x="320.4" y="34" textLength="259.2" fill="#dcf1e4"><tspan fill="#3ddc84">▸</tspan> replay it all with git am</text><g class="cv cv2"><rect class="cover" x="320.4" y="14" width="569.6" height="28"/><rect class="cur" x="320.4" y="17" width="8" height="22"/></g></g><g class="ln ln3"><text class="t" x="330" y="34" textLength="240" fill="#dcf1e4"><tspan fill="#3ddc84">▸</tspan> build. destroy. repeat.</text><g class="cv cv3"><rect class="cover" x="330" y="14" width="560" height="28"/><rect class="cur" x="330" y="17" width="8" height="22"/></g></g><rect x=".5" y=".5" width="899" height="55" rx="14" fill="none" stroke="#233a2d"/></svg>
