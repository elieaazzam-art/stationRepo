lass="cv cv3"><rect class="cover" x="39.6" y="106" width="852.4" height="19"/><rect class="cur cu3" x="39.6" y="108" width="7" height="16"/></g></g><g class="r r4"><text class="t" x="24" y="140" textLength="639.6" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> docs(m10.2): the plan — playtest-1 findings, four phases, delivery rules</text></g><g class="r r5"><text class="t" x="24" y="160" textLength="702" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> docs(playtest): record the owner's playtest-1 as result  #1 + the controls audit</text></g><g class="r r6"><text class="t" x="24" y="180" textLength="811.2" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(client): the Generals ZH camera — right-drag scroll, middle-drag rotate, the depth-scale…</text></g><g class="r r7"><text class="t" x="24" y="200" textLength="811.2" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(client): selection parity — shift+click toggle, shift+box union, double-click select-all…</text></g><g class="r r8"><text class="t" x="24" y="220" textLength="717.6" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(client): control-group double-tap centers the camera on the group (PLAN §1.3)</text></g><g class="r r9"><text class="t" x="24" y="240" textLength="561.6" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(client): the Escape ladder and the Space jump (PLAN §1.3)</text></g><g class="r r10"><text class="t" x="24" y="260" textLength="787.8" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(client): cursor order feedback — the ground marker and the armed crosshair (PLAN §1.3)</text></g><g class="r r11"><text class="t" x="24" y="280" textLength="663" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> docs(controls): the M10.2 Phase 1 control card — README + the PLAYTEST copy</text></g><g class="r r12"><text class="t" x="24" y="300" textLength="624" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> docs(assumptions): A-091..A-100 — the M10.2 Phase 1 interpretation log</text></g><g class="r r13"><text class="t" x="24" y="320" textLength="694.2" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> docs(debt): DEBT-014/015 + the DEBT-008 next human pass  is the Phase 1 re-test</text></g><g class="r r14"><text class="t" x="24" y="340" textLength="686.4" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> docs(handoff): the M10.2 Phase 1 status — snapshot, board row, gotchas, counts</text></g><g class="r r15"><text class="t" x="24" y="360" textLength="639.6" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> docs(changelog): the M10.2 Phase 1 entry — the Generals ZH controls pass</text></g><g class="r r16"><text class="t" x="24" y="380" textLength="780" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> docs(handoff): the Xvfb+XTEST Phase 1 evidence + the  recipe's M10.2 environment additions</text></g><g class="r r17"><text class="t" x="24" y="400" textLength="811.2" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> docs(assumptions): A-101..A-106 — the Phase 2 kickoff answers (palette, scope, evidence, fold…</text></g><g class="r r18"><text class="t" x="24" y="420" textLength="811.2" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(client): multi-part silhouettes per kind — the visual-legibility shapes (PLAN-M10.2 §2.1)</text></g><g class="r r19"><text class="t" x="24" y="440" textLength="811.2" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(client): blue/orange team palette, team rings under units, minimap dot sync (PLAN-M10.2 …</text></g><g class="r r20"><text class="t" x="24" y="460" textLength="709.8" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> fix(client): the no-ring structure test pointed the  spec at the wrong kind index</text></g><g class="r r21"><text class="t" x="24" y="480" textLength="663" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(client): a larger health bar for the selected entity (PLAN-M10.2 §2.3)</text></g><g class="r r22"><text class="t" x="24" y="500" textLength="499.2" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(client): the hover name tooltip (PLAN-M10.2 §2.3)</text></g><g class="r r23"><text class="t" x="24" y="520" textLength="803.4" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(client): the info panel shows the selected building's production queue (PLAN-M10.2 §2.3)</text></g><g class="r r24"><text class="t" x="24" y="540" textLength="702" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(client): distinct minimap markers — units, buildings, ore (PLAN-M10.2 §2.4)</text></g><g class="r r25"><text class="t" x="24" y="560" textLength="702" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> fix(client): drop the redundant cast the 1.98 lints  flag in the minimap painter</text></g><g class="r r26"><text class="t" x="24" y="580" textLength="717.6" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> feat(engine): calmer ground contrast — muted steppe, darker rock (PLAN-M10.2 §2.5)</text></g><g class="r r27"><text class="t" x="24" y="600" textLength="764.4" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> test(client): the display-name lookup the info panel and tooltip share (PLAN-M10.2 §2.6)</text></g><g class="r r28"><text class="t" x="24" y="620" textLength="811.2" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> docs: the M10.2 Phase 2 closeout — DEBT-016, PLAYTEST re-test row + Phase 2 note, CHANGELOG, …</text></g><g class="r r29"><text class="t" x="24" y="640" textLength="811.2" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> fix(client): big structures hover from farther out — footprint-scaled pick reach (PLAN-M10.2 …</text></g><g class="r r30"><text class="t" x="24" y="660" textLength="811.2" fill="#aab4d0"><tspan fill="#4ade80">Applying:</tspan> docs(playtest): the Xvfb machine-half evidence for the Phase 2 exit — what verified live, wha…</text></g><g class="r r31"><text class="t" x="24" y="680" fill="#ff7a3d">$</text><text class="t" x="39.6" y="680" textLength="382.2" fill="#4ade80"># 27 commits replayed — same messages, same trees</text><g class="cv cv31"><rect class="cover" x="39.6" y="666" width="852.4" height="19"/><rect class="cur cu31" x="39.6" y="668" width="7" height="16"/></g></g><g class="r r32"><text class="t" x="24" y="700" fill="#ff7a3d">$</text><rect class="cur curF cu32" x="39.6" y="688" width="7" height="16"/></g></g></g></g></g><circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/><text x="450" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12" fill="#8b95b0">pandemonium-bd — git am</text><rect x=".5" y=".5" width="899" height="323" rx="12" fill="none" stroke="#232c47"/></svg>
